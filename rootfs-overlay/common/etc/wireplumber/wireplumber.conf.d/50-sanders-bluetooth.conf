## SANDERS appliance fix (2026-09-10, BF):
## Headless device — the alarm user has NO active logind seat session
## (Weston runs outside a seat session; user@1000 is only "lingering").
## WirePlumber 0.5 gates the BlueZ monitor on seat state == "active"
## (monitors/bluez/enumerate-device.lua), so the monitor was never created
## and PipeWire never registered A2DP SEPs -> "a2dp-sink profile connect
## failed: Protocol not available" in bluetoothd. Disabling the seat gate
## makes the monitor start unconditionally.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
