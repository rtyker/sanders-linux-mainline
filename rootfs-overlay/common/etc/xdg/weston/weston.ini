# SANDERS desktop shell — barra superior estilo Android (Fase 1)
# Painel nativo do Weston no topo com relógio + launchers.
# Doc: docs/STATUSBAR_QUICKSETTINGS_PLAN.md (BF, 2026-09-10)
[shell]
panel-position=none
clock-format=truncated-24h
panel-color=0xf0101010
background-color=0xff000000
background-image=/usr/share/backgrounds/sanders/wallpaper.png
background-type=scale-crop

[launcher]
icon=/usr/share/sanders-shell/icons/quicksettings.png
path=/usr/local/bin/sanders-quicksettings-launch

[launcher]
icon=/usr/share/sanders-shell/icons/player.png
path=/root/mp3_player/player_gtk4

[launcher]
icon=/usr/share/sanders-shell/icons/terminal.png
path=/usr/bin/weston-terminal
