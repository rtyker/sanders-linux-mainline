# Desabilita suspend/hibernate/hybrid-sleep de proposito.
#
# Este e um servidor headless, sempre ligado na tomada, sem tela nem
# usuario interativo — nao ha motivo pra entrar em sleep, e ha um
# motivo concreto pra NAO entrar: o watchdog de hardware qcom-wdt
# (RuntimeWatchdogSec=30s em system.conf.d/10-watchdog.conf) so e
# alimentado enquanto o systemd esta rodando ativamente. Se o sistema
# suspender (s2idle/deep sleep), o systemd para de pingar o watchdog;
# se o timer de hardware continuar contando durante o sleep (comum em
# SoCs Qualcomm sem handoff explicito do watchdog pro PMIC/RPM), o
# aparelho reinicia sozinho ~30s depois de suspender. Documentado em
# docs/KNOWN_ISSUES_AND_POTENTIAL_BUGS.md (BUG-03).
#
# Bloqueando aqui na origem (systemd-sleep) em vez de so mitigar: cobre
# suspend disparado por botao de power, por policy de bateria fraca via
# upower/logind, ou por `systemctl suspend` manual — nao so o caso que
# a gente pensou em testar.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
