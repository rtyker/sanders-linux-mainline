EnableSequence [
	cset "name='SPK DAC Switch' 1"
	cset "name='RX3 MIX1 INP1' RX1"
	# 'RX3 Mute Switch'=on e o default do driver e significa MUDO ATIVO
	# (nome enganoso, nao "unmute habilitado"). Sem isso, o path DAPM
	# fica todo correto mas nenhum som sai do speaker.
	cset "name='RX3 Mute Switch' 0"
]
