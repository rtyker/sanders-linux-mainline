EnableSequence [
	cset "name='RX1 MIX1 INP1' RX1"
	cset "name='RX2 MIX1 INP1' RX2"
	cset "name='RDAC2 MUX' RX2"
	cset "name='HPHL' 1"
	cset "name='HPHR' 1"
	# Ver comentario em SpeakerEnableSeq.conf: 'Mute Switch'=on e o
	# default do driver e significa mudo ativo.
	cset "name='RX1 Mute Switch' 0"
	cset "name='RX2 Mute Switch' 0"
]
